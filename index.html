async function backupCollections(collectionNames, filePrefix) {
  const btn = document.getElementById('backup-btn');
  const statusEl = document.getElementById('backup-status');
  if (btn) { btn.textContent = 'Backing up…'; btn.disabled = true; }
  if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '<div style="font-size:12px;color:var(--text2)">Collecting data…</div>'; }

  try {
    const backup = {
      metadata: {
        exportedAt: new Date().toISOString(),
        exportedBy: CD?.name || 'Admin',
        projectId: 'swl-checklist',
        collections: collectionNames,
        version: '1.0'
      },
      data: {}
    };

    let totalDocs = 0;
    for (const colName of collectionNames) {
      if (statusEl) statusEl.innerHTML = `<div style="font-size:12px;color:var(--text2)">Exporting ${colName}…</div>`;
      try {
        const snap = await db.collection(colName).get();
        backup.data[colName] = {};
        snap.docs.forEach(d => {
          // Convert Firestore timestamps to ISO strings for portability
          const data = d.data();
          const cleaned = cleanForExport(data);
          backup.data[colName][d.id] = cleaned;
        });
        totalDocs += snap.size;
      } catch(e) {
        backup.data[colName] = { _error: `Could not export: ${e.message}` };
      }
    }

    // Create download
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = now.toTimeString().slice(0,5).replace(':','-');
    a.download = `${filePrefix}_${dateStr}_${timeStr}.json`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);

    if (statusEl) {
      statusEl.innerHTML = `
        <div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px">
          <strong style="color:var(--success)">✓ Backup downloaded successfully</strong><br>
          <span style="font-size:12px;color:var(--text2)">${totalDocs} documents exported from ${collectionNames.length} collection(s) · ${(json.length/1024).toFixed(1)} KB</span><br>
          <span style="font-size:11px;color:var(--text3)">File: ${a.download} · Save this to your OneDrive backup folder</span>
        </div>`;
    }

    // Log the backup
    try {
      await db.collection('sync_log').add({
        userId: CU.uid, userName: CD.name,
        action: 'data_backup',
        details: `Exported ${totalDocs} docs from: ${collectionNames.join(', ')}`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e) { /* silent */ }

    toast(`✓ Backup downloaded — ${totalDocs} records`);

  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Error: ${esc(e.message)}</div>`;
    toast('Backup failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.textContent = 'Download Full Backup (JSON)'; btn.disabled = false; }
  }
}

function cleanForExport(data) {
  // Recursively convert Firestore special types to plain JS
  if (data === null || data === undefined) return data;
  if (typeof data !== 'object') return data;
  if (data.toDate && typeof data.toDate === 'function') {
    // Firestore Timestamp
    return data.toDate().toISOString();
  }
  if (Array.isArray(data)) return data.map(cleanForExport);
  const result = {};
  Object.entries(data).forEach(([k, v]) => { result[k] = cleanForExport(v); });
  return result;
}

function previewRestore(input) {
  const file = input.files[0];
  if (!file) return;
  const nameEl = document.getElementById('restore-filename');
  const previewEl = document.getElementById('restore-preview');
  if (nameEl) nameEl.textContent = file.name;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const backup = JSON.parse(e.target.result);
      const meta = backup.metadata || {};
      const collections = Object.keys(backup.data || {});
      const totalDocs = collections.reduce((sum, col) => {
        return sum + Object.keys(backup.data[col] || {}).length;
      }, 0);

      if (previewEl) {
        previewEl.style.display = 'block';
        previewEl.innerHTML = `
          <div style="background:var(--warn-l);border:1px solid #FDE68A;border-radius:var(--r);padding:14px 16px">
            <div style="font-size:13px;font-weight:700;color:var(--warn);margin-bottom:10px">⚠ Restore Preview — Review before proceeding</div>
            <div style="font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:12px">
              <div><strong>Exported:</strong> ${esc(meta.exportedAt||'Unknown')}</div>
              <div><strong>Exported by:</strong> ${esc(meta.exportedBy||'Unknown')}</div>
              <div><strong>Collections:</strong> ${esc(collections.join(', '))}</div>
              <div><strong>Total records:</strong> ${totalDocs}</div>
            </div>
            ${collections.map(col => {
              const count = Object.keys(backup.data[col]||{}).length;
              return `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #FDE68A">
                <strong>${esc(col)}</strong>: ${count} documents
              </div>`;
            }).join('')}
            <div style="margin-top:14px;display:flex;gap:8px">
              <button class="btn danger" onclick="confirmRestore(${JSON.stringify(JSON.stringify(backup)).slice(0,10)})" 
                onclick="restoreFromBackup(this._backup)" 
                style="cursor:pointer"
                data-backup='${JSON.stringify(backup).replace(/'/g,"&#39;")}'>
                ⚠ Restore This Backup
              </button>
              <button class="btn" onclick="document.getElementById('restore-preview').style.display='none'">Cancel</button>
            </div>
            <div style="font-size:11px;color:var(--danger);margin-top:8px;font-weight:500">Warning: Restoring will overwrite current data in these collections. This cannot be undone.</div>
          </div>`;

        // Attach the full backup to the restore button
        const restoreBtn = previewEl.querySelector('[data-backup]');
        if (restoreBtn) {
          restoreBtn.onclick = () => restoreFromData(backup);
        }
      }
    } catch(e) {
      if (previewEl) {
        previewEl.style.display = 'block';
        previewEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Invalid backup file: ${esc(e.message)}</div>`;
      }
    }
  };
  reader.readAsText(file);
}

async function restoreFromData(backup) {
  if (!confirm('⚠️ This will overwrite existing data. Are you absolutely sure?')) return;
  if (!confirm('Second confirmation: this CANNOT be undone. Proceed with restore?')) return;

  const statusEl = document.getElementById('backup-status');
  if (statusEl) { statusEl.style.display='block'; statusEl.innerHTML='<div style="font-size:12px;color:var(--text2)">Restoring…</div>'; }

  try {
    const collections = Object.keys(backup.data || {});
    let totalRestored = 0;

    for (const colName of collections) {
      const docs = backup.data[colName];
      if (!docs || typeof docs !== 'object') continue;
      const entries = Object.entries(docs);
      if (statusEl) statusEl.innerHTML = `<div style="font-size:12px;color:var(--text2)">Restoring ${colName} (${entries.length} docs)…</div>`;

      // Batch write in groups of 500 (Firestore limit)
      for (let i = 0; i < entries.length; i += 400) {
        const batch = db.batch();
        entries.slice(i, i+400).forEach(([docId, data]) => {
          const ref = db.collection(colName).doc(docId);
          batch.set(ref, data);
        });
        await batch.commit();
        totalRestored += Math.min(400, entries.length - i);
      }
    }

    if (statusEl) statusEl.innerHTML = `
      <div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px">
        <strong style="color:var(--success)">✓ Restore complete</strong><br>
        <span style="font-size:12px;color:var(--text2)">${totalRestored} documents restored across ${collections.length} collection(s)</span>
      </div>`;
    toast(`✓ Restored ${totalRestored} records`);

  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Restore failed: ${esc(e.message)}</div>`;
    toast('Restore failed: ' + e.message, 'err');
  }
}

async function uploadUserPhoto(uid, input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please select an image file','err'); return; }
  if (file.size > 500000) { toast('Image must be under 500KB','err'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const dataURL = e.target.result;
    await db.collection('users').doc(uid).update({ photoURL: dataURL });
    toast('✓ Photo uploaded');
    renderAdmin();
  };
  reader.readAsDataURL(file);
}

async function toggleUser(uid, active) {
  await db.collection('users').doc(uid).update({ active: !active });
  toast(`User ${active?'disabled':'enabled'}`); renderAdmin();
}

async function createUserProfile() {
  const uid      = document.getElementById('nu-uid').value.trim();
  const name     = document.getElementById('nu-name').value.trim();
  const email    = document.getElementById('nu-email').value.trim();
  const role     = document.getElementById('nu-role').value;
  const branch   = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result   = document.getElementById('nu-result');

  if (!uid)    { toast('Firebase UID is required','err'); return; }
  if (!name)   { toast('Full name is required','err'); return; }
  if (!email)  { toast('Email is required','err'); return; }
  if (!role)   { toast('Role is required','err'); return; }
  if (!branch) { toast('Branch is required','err'); return; }

  // Determine the correct formType if not manually set
  const autoFormType = formType || (
    role === 'branch_manager'        ? 'bm'    :
    role === 'ops_manager'           ? 'om'    :
    role === 'ops_specialist'        ? 'os'    :
    role === 'irrigation_supervisor' ? 'sv'    :
    role === 'client_rep' || role === 'client_rep_2' ? (branch==='LA'?'cr-la':'cr-oc') : 'cr-oc'
  );

  const actualRole = role === 'client_rep_2' ? 'client_rep' : role;

  try {
    await db.collection('users').doc(uid).set({
      name, email,
      role: actualRole,
      branch,
      formType: autoFormType,
      active: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Show success inline
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">
        <strong>✓ Profile created for ${esc(name)}</strong><br>
        <span style="font-size:11px;color:var(--text2)">Role: ${ROLES[actualRole]?.label||actualRole} · Branch: ${branch} · Form: ${autoFormType}</span><br>
        <span style="font-size:11px;color:var(--text3)">They can now log in with their Firebase Auth email and password.</span>
      </div>`;
    }

    toast('✓ User profile created for ' + name);

    // Clear form
    ['nu-uid','nu-name','nu-email'].forEach(id => document.getElementById(id).value = '');

    // Refresh user list
    setTimeout(() => renderAdmin(), 800);

  } catch(e) {
    toast('Error: ' + e.message, 'err');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--danger-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger)">Error: ${esc(e.message)}</div>`;
    }
  }
}

async function updateUserProfile() {
  const uid    = document.getElementById('nu-uid').value.trim();
  const name   = document.getElementById('nu-name').value.trim();
  const email  = document.getElementById('nu-email').value.trim();
  const role   = document.getElementById('nu-role').value;
  const branch = document.getElementById('nu-branch').value;
  const formType = document.getElementById('nu-formtype').value;
  const result = document.getElementById('nu-result');

  if (!uid) { toast('Firebase UID is required to update','err'); return; }

  const updates = {};
  if (name)   updates.name   = name;
  if (email)  updates.email  = email;
  if (role)   updates.role   = role === 'client_rep_2' ? 'client_rep' : role;
  if (branch) updates.branch = branch;
  if (formType) updates.formType = formType;

  try {
    await db.collection('users').doc(uid).update(updates);
    toast('✓ Profile updated');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div style="background:var(--success-l);border:1px solid #A7F3D0;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--success)">✓ Profile updated successfully.</div>`;
    }
    setTimeout(() => renderAdmin(), 800);
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  }
}
